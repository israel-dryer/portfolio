alsoLabel: Also maintaining
also:
  - name: bootstack
    href: https://bootstack.org
    right: 2026 — present
    figures:
      - base: bootstack-home-hero
        alt: >-
          A bootstack analytics dashboard: charts, metrics and a data table in a
          desktop window
        caption: A dashboard built with bootstack. Desktop Python, no web view.
        remote:
          light: https://bootstack.org/_images/home-hero-light.png
          dark: https://bootstack.org/_images/home-hero-dark.png
    body:
      - >-
        A full application framework on Tk, and the largest of the three. Declarative
        context-manager layout where the code hierarchy <em>is</em> the UI hierarchy;
        reactive signals for state that flows between widgets; an event stream API with
        composable filtering, debounce and throttle; hot reload that keeps your place
        across saves; and a CLI that scaffolds a project, runs it, and packages it to a
        standalone executable.
    grid:
      - base: bootstack-workbench-hero
        alt: "bootstack workbench layout: navigation rail, sidebar and content area"
        caption: Workbench — rail, sidebar, content.
        sizes: "(min-width: 700px) 410px, 100vw"
        remote:
          light: https://bootstack.org/_images/workbench-hero-light.png
          dark: https://bootstack.org/_images/workbench-hero-dark.png
      - base: bootstack-datatable-hero
        alt: bootstack DataTable with column chooser, filtering and grouping
        caption: DataTable — filter, group, edit, export.
        sizes: "(min-width: 700px) 410px, 100vw"
        remote:
          light: https://bootstack.org/_images/datatable-hero-light.png
          dark: https://bootstack.org/_images/datatable-hero-dark.png
    tags: [Python, Reactive state, CLI tooling, Packaging]
    stats:
      - { n: 60+, cap: widgets }
      - { n: Signals, cap: reactive state }
      - { n: Hot reload, cap: keeps your place }

  - name: tkinter-icons
    href: https://tkinter-icons.readthedocs.io
    right: 2025 — present
    figures:
      - base: tkinter-icons-hero
        alt: Icon glyphs from sixteen icon packs rendered by tkinter-icons
        caption: Sixteen icon families, one API, no image files on disk.
        remote:
          light: https://tkinter-icons.readthedocs.io/en/latest/_images/hero-light.png
          dark: https://tkinter-icons.readthedocs.io/en/latest/_images/hero-dark.png
    body:
      - >-
        A font-based icon system for tkinter — Material, Font Awesome, Lucide,
        Bootstrap, Simple Icons and eleven more behind one uniform API. Shipped as
        eighteen distributions that install as extras, so you pick the families you
        want and the distribution names never surface in your code.
    tags: [Python, Packaging, Font rendering]
    stats:
      - { n: "61,000+", cap: icons }
      - { n: "16", cap: families }
      - { n: "18", cap: distributions }

