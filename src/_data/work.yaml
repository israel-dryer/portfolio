            retail enterprise, and supported additional large-scale customers including a
            Fortune 100 industrial distributor.
          - >-
            Formalized platform documentation and training, improving onboarding speed
            and consistency across concurrent implementation efforts.
          - >-
            Served as the link between implementation teams, platform engineering, and
            product management, bringing an implementer's perspective into roadmap and
            feature design decisions.

