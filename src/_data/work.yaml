label: Work

# ONE employment history, rendered two ways.
#   index.njk   uses `body` (prose) and skips entries marked `home: false`
#   resume.njk  uses `bullets` under each role, and shows everything
#
# Prose first, then the role history. A paragraph placed under a list of roles
# reads as a caption for the last one — this order avoids that.

employers:
  - name: LogistiVIEW
    location: Charlotte, NC
    body: >-
      I find the gaps in the platform, propose what should fill them, and then build
      it. Shared capabilities — Workflow Builder, Dataset Builder, Parameter Guidance,
      configurable web forms — designed so implementation teams can adapt them without
      pulling in engineering. Underneath that, the high-volume operational workflows
      themselves, including a re-architecture of core task management for the
      batch-driven operating model of a Fortune 100 retail enterprise.
    tags: [Angular, TypeScript, Systems design, Client-facing]
    roles:
      - title: Senior Software Engineer
        dates: Nov 2024 — present
        lede: >-
          Identify platform gaps, propose solutions, and implement them — working
          directly with leadership to shape what gets built. Primarily Angular and
          TypeScript.
        bullets:
          - >-
            Re-architected core Task Management to support batch-driven operating models
            for a Fortune 100 retail enterprise, then built the high-throughput
            operational workflows that run on it.
          - >-
            Delivered and modernized shared platform capabilities — Workflow Builder,
            Dataset Builder, Parameter Guidance, Knowledge Base, and Logging &amp;
            Monitoring — designing each for configurability so implementation teams can
            adapt them without pulling in engineering.
          - >-
            Defined the platform's approach to configurable web forms and drove adoption
            of DevExtreme components, improving UI consistency and giving implementers a
            faster path to building complex workflows.

      - title: Platform Architect
        dates: Oct 2021 — Nov 2024
        bullets:
